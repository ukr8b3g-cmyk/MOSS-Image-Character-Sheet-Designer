name: Test and publish MOSS prompt editor
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: moss-tests-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python regression tests
        run: python -B -m unittest discover -s tests -p 'test_*.py'
      - name: Install test-only DOM support
        run: npm install --prefix "$RUNNER_TEMP/moss-ui-test" --ignore-scripts jsdom@30.1.1
      - name: JavaScript and DOM regressions
        run: MOSS_TEST_JSDOM="$RUNNER_TEMP/moss-ui-test/node_modules/jsdom/lib/api.js" npm test
  release:
    needs: test
    if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Add editable MOSS view prompts (v1.0.1)')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Build and publish the tested revision
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(python -c 'import json; print(json.load(open("package.json"))["version"])')" = '1.0.1'
          mkdir -p staging/MOSS-Image-Character-Sheet-Designer dist
          git archive HEAD | tar -x -C staging/MOSS-Image-Character-Sheet-Designer
          (cd staging && 7z a -tzip ../dist/MOSS-Image-Character-Sheet-Designer-v1.0.1.zip MOSS-Image-Character-Sheet-Designer >/dev/null)
          7z t dist/MOSS-Image-Character-Sheet-Designer-v1.0.1.zip >/dev/null
          cp 'examples/MOSS-Image Character Sheet Designer - Text or Image.json' dist/MOSS-Image-Character-Sheet-Designer-v1.0.json
          (cd dist && sha256sum *.zip *.json > SHA256SUMS.txt)
          if gh release view v1.0.1 --json tagName >/dev/null 2>&1; then
            test "$(gh api repos/$GITHUB_REPOSITORY/git/ref/tags/v1.0.1 --jq .object.sha)" = "$RELEASE_SHA"
          else
            gh release create v1.0.1 --target "$RELEASE_SHA" --draft --title 'MOSS-Image Character Sheet Designer v1.0.1' --notes-file docs/releases/v1.0.1.md
          fi
          for asset in dist/*; do
            name=$(basename "$asset")
            if gh release view v1.0.1 --json assets --jq '.assets[].name' | grep -Fxq "$name"; then
              gh release download v1.0.1 --pattern "$name" --dir verify-existing
              cmp "$asset" "verify-existing/$name"
            else
              gh release upload v1.0.1 "$asset"
            fi
          done
          gh release edit v1.0.1 --draft=false --latest
